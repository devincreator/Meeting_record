schema: spec-driven
context: |
  项目：中文研究型会议纪要工作流。
  输入：用户明确指定的录音转写、访谈原文、附件及其允许引用的场次。
  默认：按场次分别成文；核心要点不超过5条；详细纪要不超过9节，不能遗漏重要内容。
  文风：直接陈述结论、连续自然段；无问答口语、无“公司认为/交流中提到”、无额外推断或“注意事项”。
  交付：需要Word时，通篇黑字、无段首方点，生成后验证完整性和排版。
rules:
  proposal: |
    规范改动不得擅自扩大事实来源、删减重要数字和逻辑、降低专业纠错标准；用户最新明确要求优先。
  specs: |
    以 WHEN/THEN 场景验收来源覆盖、分场、正文完整性、数值口径、专业术语、文风与Word质量。
  design: |
    先做场次识别与信息覆盖底稿，再按结论式两级结构写作；不得以逐字转录替代纪要。
  tasks: |
    核实来源边界、划分主讲场次、映射重点信息、消除不确定术语的误替换、检查排版与文件链接。
